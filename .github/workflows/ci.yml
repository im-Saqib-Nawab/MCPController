name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/mcpcontroller_test
          JWT_SECRET: ci-test-jwt-secret-value
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: change-this-password
          APP_URL: http://localhost:5173
          API_URL: http://127.0.0.1:3000

      - name: Build client
        run: npm run build
